[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ladder-agent"
version = "0.1.0"
description = "Evidence-bound practice sets for mixed-ability classrooms, built with the Strands Agents SDK"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abhinav Shukla" }]
keywords = ["strands-agents", "education", "aws", "bedrock", "agents"]
dependencies = [
  "strands-agents>=1.62.0",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ladder = "ladder.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
